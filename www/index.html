<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AppCameraAMS2 | ALS</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <h1>Camara en Vivo</h1>
    <video id="video" autoplay playsinline></video>
    <img id="foto" alt="Foto capturada">
    <div class="controles">
        <button class="btn" onclick="iniciarCamara()">Iniciar camara</button>
        <button class="btn btn-capture" onclick="tomarFoto()">Tomar foto</button>
        <button class="btn btn-stop" onclick="detenerCamara()">Detener camara</button>
    </div>
    <p id="status">Presiona "Iniciar cámara" para comenzar</p>
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="js/index.js"></script>
    <script src="cordova.js"></script>
</body>
</html>
